name: Comprovacions
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/check.mjs
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 3000 &) && sleep 1 && node tests/e2e.mjs && LANG2=es TOUCH=1 VW=390 VH=844 node tests/e2e.mjs
